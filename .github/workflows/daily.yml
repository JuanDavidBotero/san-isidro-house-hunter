name: Daily radar (optional cloud path)

# NOTE: the primary schedule for this project is LOCAL, via ./install-schedule.sh
# (launchd). This workflow is the optional cloud alternative and is not required.
#
# Differences from the local run:
#   - sweep.py drives the `claude` CLI, which on a runner has no subscription to use,
#     so this needs an ANTHROPIC_API_KEY secret. The local run uses your Claude Code
#     subscription instead and needs no key.
#   - History must survive between runs or every listing is NEW every morning. Since
#     .gitignore excludes data/*.sqlite3 and research/*.jsonl (they hold broker contact
#     details), state is force-written to a dedicated `state` branch. `main` stays
#     clean; the repo is private so nothing is exposed; git history gives a free audit
#     trail of every price move.
#     actions/cache is deliberately NOT used: caches are evicted silently, and a silent
#     eviction is indistinguishable from a flood of genuinely new discoveries.
#
# MercadoLibre's API is not used for discovery. It returns 403
# (PA_UNAUTHORIZED_RESULT_FROM_POLICIES) for search AND single-item lookup, with both
# app- and user-context tokens. See the verdict block in fetch_ml.py.

on:
  schedule:
    # 11:00 UTC = 08:00 in Argentina (UTC-3, no DST). GitHub's scheduler is
    # best-effort and often runs late under load; fine for a daily radar.
    - cron: "0 11 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Resolve routing and print the report without sending"
        type: boolean
        default: false
      force_telegram:
        description: "Send to Telegram even when there is no change"
        type: boolean
        default: false

concurrency:
  group: daily-radar
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out main
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # Stdlib only, by design. Nothing to install, nothing to pin, nothing to break.
      - name: Verify no dependencies are required
        run: python3 -c "import hunter, fetch_ml, notify, sweep; print('imports clean')"

      - name: Run tests
        run: PYTHONPATH=.:tests python3 -m unittest test_hunter test_automation test_sweep

      - name: Install the Claude CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Smoke-test the CLI and confirm WebSearch exists
        # This is the step that would otherwise fail confusingly inside the sweep. A
        # fresh runner has no Claude config, and the sweep is useless without a search
        # tool: WebFetch alone can only re-read URLs it already knows, so it cannot
        # DISCOVER anything. Verified here, loudly, before any real work.
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${ANTHROPIC_API_KEY:-}" ]; then
            echo "::error::ANTHROPIC_API_KEY is not set. The cloud path needs it because" \
                 "a runner has no Claude Code subscription. Add it under Settings ->" \
                 "Secrets and variables -> Actions."
            exit 1
          fi
          OUT=$(claude -p 'List the tool names you can call right now, comma separated, nothing else.' \
                  --output-format text \
                  --allowedTools "WebSearch,WebFetch" \
                  --permission-mode bypassPermissions 2>&1) || {
            echo "::error::The Claude CLI failed to run. Output: $OUT"
            exit 1
          }
          echo "tools reported: $OUT"
          if ! printf '%s' "$OUT" | grep -qi "websearch"; then
            echo "::error::WebSearch is not available to the CLI on this runner. The sweep" \
                 "cannot discover new listings with WebFetch alone. Check that the API key" \
                 "is valid and that web search is enabled for the account."
            exit 1
          fi
          echo "WebSearch confirmed available."

      - name: Restore radar history from the state branch
        run: |
          set -euo pipefail
          if git fetch origin state --depth=1 2>/dev/null; then
            # Only restore state paths; never let the branch overwrite code.
            git checkout origin/state -- data research reports 2>/dev/null || true
            echo "Restored prior state."
          else
            echo "No state branch yet. First run; history starts empty."
          fi
          python3 hunter.py init

      - name: Discover listings (public-web sweep)
        id: discover
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${ANTHROPIC_API_KEY:-}" ]; then
            echo "::error::ANTHROPIC_API_KEY is not set. The cloud path needs it because" \
                 "a runner has no Claude Code subscription. Either add the secret or use" \
                 "the local launchd schedule instead (./install-schedule.sh)."
            exit 1
          fi
          python3 sweep.py --raw-output sweep-raw.txt | tee discover.json
          echo "packet=$(python3 -c "import json;print(json.load(open('discover.json'))['packet'])")" >> "$GITHUB_OUTPUT"

      - name: Upload the raw sweep output for debugging
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sweep-raw
          path: sweep-raw.txt
          if-no-files-found: ignore

      - name: Ingest into persistent history
        run: |
          set -euo pipefail
          PACKET="${{ steps.discover.outputs.packet }}"
          if [ -s "$PACKET" ]; then
            python3 hunter.py ingest --input "$PACKET"
          else
            echo "Empty packet; nothing to ingest. The report falls through to NO CHANGE."
          fi

      - name: Build and deliver the report
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: |
          set -euo pipefail
          TODAY=$(date -u +%F)
          python3 notify.py \
            --save "reports/${TODAY}.md" \
            ${{ inputs.dry_run && '--dry-run' || '' }} \
            ${{ inputs.force_telegram && '--force-telegram' || '' }}

      - name: Show today's report in the run log
        if: always()
        run: cat "reports/$(date -u +%F).md" || echo "(no report written)"

      - name: Persist state back to the state branch
        if: success() && !inputs.dry_run
        run: |
          set -euo pipefail
          git config user.name "san-isidro-radar"
          git config user.email "radar@users.noreply.github.com"
          git checkout -B state
          # -f because these paths are gitignored for local hygiene; on this
          # machine-owned branch we want them tracked. The globs deliberately do NOT
          # match data/ml_refresh_token -- a live credential must never be committed.
          git add -f data/*.sqlite3 research/*.jsonl reports/*.md 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No state changes to persist."
          else
            git commit -m "state: radar run $(date -u +%F)"
            git push --force origin state
          fi

      - name: Report a failed run to Telegram
        # A silently dead radar is indistinguishable from a quiet market, which is the
        # most dangerous failure mode this project has.
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python3 notify.py --force-telegram --text "⚠️ San Isidro radar FAILED on $(date -u +%F).
          Today's silence is NOT evidence that the market was quiet.
          Run log: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" || true
